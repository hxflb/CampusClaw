{% extends "base.html" %}
{% block title %}{{ material.title }} · CampusClaw{% endblock %}
{% block body %}
<p class="crumb">
  <a class="btn btn-ghost" href="{{ url_for('materials.list_page') }}">
    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> 返回列表
  </a>
</p>
<article class="card">
  <h1><i class="fa-regular fa-file-lines" aria-hidden="true"></i> {{ material.title }}</h1>
  <p class="lead"><i class="fa-solid fa-database" aria-hidden="true"></i> 知识库正文（本班可见）</p>
  {% if role == 'teacher' %}
  <p class="actions">
    <a class="btn btn-ghost" href="{{ url_for('materials.edit_page', material_id=material.id) }}">
      <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i> 修改
    </a>
    <form class="inline" method="post" action="{{ url_for('materials.delete_material', material_id=material.id) }}" onsubmit="return confirm('确定删除这份资料？删除后无法恢复。');">
      <button class="btn btn-danger" type="submit">
        <i class="fa-solid fa-trash" aria-hidden="true"></i> 删除
      </button>
    </form>
  </p>
  {% endif %}
  <pre class="body">{{ material.body_text or '' }}</pre>
</article>
{% endblock %}
