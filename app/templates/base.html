<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CampusClaw{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5">
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="brand" href="{{ url_for('materials.list_page') if session.get('user_id') else url_for('auth.login') }}">
        <i class="fa-solid fa-paw" aria-hidden="true"></i>
        CampusClaw
      </a>
      <p class="tag"><i class="fa-solid fa-book-open" aria-hidden="true"></i> 班级知识库</p>
      {% if session.get('user_id') %}
      <nav>
        <span class="who">
          <i class="fa-solid {{ 'fa-chalkboard-user' if session.role == 'teacher' else 'fa-user' }}" aria-hidden="true"></i>
          {{ session.username }} · {{ '教师' if session.role == 'teacher' else '学生' }}
        </span>
        <a class="btn btn-ghost" href="{{ url_for('auth.logout') }}">
          <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> 退出
        </a>
      </nav>
      {% endif %}
    </header>
    <main>
      {% block body %}{% endblock %}
    </main>
  </div>
</body>
</html>
